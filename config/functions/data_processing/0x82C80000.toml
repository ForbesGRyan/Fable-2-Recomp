# A memmove (overlap-safe copy): copy `size` bytes from src to dst, handling the
# case where the regions overlap.

# Args: dst (r3), src (r4), size (r5). If dst == src, return (nothing to do). If dst
# < src (no dangerous overlap), delegate to the forward SDK copy -- 
