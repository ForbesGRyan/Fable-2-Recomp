# Pattern per entry: addi r4,<fn> ; bl ProcessAndResolveTypedField(0x8219ab28)
# ; addi r29,<name str> ; mr r5,r29 ; bl ProcessAndCopyReferenceAndHash
# (0x824ef160) ; bl ProcessAndHashString(0x82A1EC08) ; bl
# ProcessAndAppendElement(0x82229208). Subtables (Debug., Player., ...) are
# attached via ScriptApi_AddTableEntry_825B7858. Extracted table
# (see tools/dump_lua_api.py; guest = file offset + 0x82000000):
#   0x821C21F8 GetRandomNumber           0x821F6CE0 GetTickRate
#   0x82447918 GetSquaredDistanceBetweenEntityAndLODCentre
#   0x8249BA10 GetRandomFloat            0x825B9018 CreateEntityAtEntitysPosition
#   0x825B90D8 GetPlayerEntityWithIndex  0x825B9210 GetNearestPlayerTo
#   0x825B9308 FNVHash                   0x825B9388 StartPubGame
#   0x825B9580 GetSquaredDistanceBetweenPositionAndLODCentre
#   0x825B9608 GetCurrentCamera          0x825B96B8 LogAIBehaviourEvent
#   0x825B9750 LogEvent                  0x825B97D8 CreateEntityFromLimbo
#   0x826064D0 IsEntityToCallFunction    0x8266F570 PutEntityInLimbo
#   0x8279DCD8 IsEntityWithinDistanceOfLODCentre
#   0x82806168 RunScript  <- injection point for external Lua scripts
#   0x828BE3F0 GetCurrentWorldFrame
[functions."0x825AF6D0"]
name = "ScriptApi_RegisterGlobalTable_825AF6D0"


# Formats the script-load error message: "Lua <type> script \"<name>\" has
# an error in it". References the format fragments "Lua serialise script "
# (0x820C2388), "Lua save load system script " (0x820C23A0), "Lua general
# script " (0x820C23C0), "Lua AI script " (0x820C23D8), "Lua quest script "
# (0x820C23F8), "Lua Camera script " (0x820C2414), "Lua script " (0x820C2448).
# r3 = string object (CopyAssign'd), r4 = context. Part of the C++ script
# loader core's error path (the loader itself is the caller).
[functions."0x825ADB40"]
name = "LuaScriptError_FormatMessage_825ADB40"


# Registers the string-name table for combat/action effect types.
# Interns the type names (ACTION, STRIKE_START, STRIKE_END, STRIKE,
# HIT_DIRECTION, STANCE, PARTICLE, SOUND, SPEECH, CAMERA_SHAKE,
# CONTROL_RUMBLE, EARTHQUAKE, SHOOT, THROW, POUND, CREATE_ENTITY,
# DESTROY_ENTITY, COMBAT, UNSHEATHE, INSTANT_KILL, InterruptKORecoverAttack,
# TROLL_FOOTSTEP, ...) via LookupString2_8246C010 from the 0x820B/0x820C
# data pages. Backs the ScriptEnum-style action-type constants used by
# script code (e.g. EScriptableAction tables).
[functions."0x82514818"]
name = "RegisterActionEffectTypeStrings_82514818"
