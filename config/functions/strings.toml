# A case-INSENSITIVE string compare (stricmp). 211 call sites.

# Args: str1 (r3), str2 (r4). Walks both strings byte-by-byte (lbzu
# pre-increment). At each step compute diff = str1byte - str2byte; if str2byte is
# the 0 terminator, return (0 if the strings are equal, else the running diff);
# if diff == 0 continue. On the FIRST difference, fold both bytes to lowercase
# (if a byte is in 'A'..'Z', OR in bit 5 / 32) and recompute diff; if the
# folded diff is 0 (they differ only by case) keep scanning, else return the
# signed folded difference. So it returns 0 when the strings are equal ignoring
# case, and a nonzero signed value otherwise. Named StrCmpIgnoreCase to convey
# the case-insensitive ordering (and keep the guest symbol distinct from host
# libc); the signed-byte variant is StrCmp_Signed_8226D7A8.
[functions."0x82CA6320"]
name = "StrCmpIgnoreCase_82CA6320"


