# SDK runtime memcpy: memcpy(dest=r3, src=r4, len=r5), returns dest
# (saved at -8(r1) on entry). ~290 insns: byte-wise dest alignment, 4/8-byte
# misaligned paths, 64-byte unrolled main loop, 128-byte dcbt prefetch for
# len >= 128, dcbtst writeback hints on the tail. 1310 call sites — the
# image's dominant copy primitive (game + SDK code). Named MemCpy_SdkRuntime
# (not bare "memcpy") to keep the guest symbol distinct from host libc in
# traces and to avoid any global-namespace ambiguity.
[functions."0x82CA2C60"]
name = "MemCpy_SdkRuntime_82CA2C60"


# ---------------------------------------------------------------------------
# A word-aligned memcpy (SDK region, sibling of memset sub_82CA3190), a
# triple-vcall gate, and a table-dispatched chunk writer.
# ---------------------------------------------------------------------------

# A word-aligned memcpy: memcpy(dst=r3, src=r4, len=r5), returns nothing
# (void). Classic PPC byte-align -> word-copy -> tail-bytes structure: a byte
# loop aligns dst to a 4-byte boundary, then a 4-byte word loop (with a separate
# unaligned-source branch) copies the bulk, then a final byte loop copies the
# <4 remainder. Forward-only, no overlap handling (plain memcpy semantics).
# Sits in the SDK runtime region immediately before memset (sub_82CA3190).
# 34 DIRECT call sites (e.g. `r4=src; r5=496; bl`), AND it is the aligned-chunk
# helper that MemCpy_Vectorized_822085D0 calls for its small-path (len<16) word
# copy. Named MemCpy_Aligned to distinguish it from MemCpy_SdkRuntime_82CA2C60
# (the ~1.2 KB unrolled CRT memcpy) and MemCpy_Vectorized_822085D0 (SIMD), and
# to keep the guest symbol distinct from host libc.
[functions."0x82CA30E8"]
name = "MemCpy_Aligned_82CA30E8"


