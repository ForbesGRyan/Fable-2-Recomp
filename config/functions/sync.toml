# Locked per-entry processing loop over a 388-byte-entry array. Args: obj
# (r3). Guards: tail word *(obj->280 + obj->276*388 - 40) != 0 and
# obj->692 != 0. Locks the mutex at (obj+852)->+4 via
# MutexLock_WaitInfinite (bails without processing if the lock cannot be
# taken). Loops i over obj->276 entries (array at obj->280, stride 388):
# vcall entry->348 (skip entry if it returns 0), range checks over entry
# fields 0/8/12/16/24/48/52/68, vcall entry->352 (fetch buffer info into
# stack slots r1+80/84), then a byte transform that toggles each byte's
# high bit (b+128 == b XOR 0x80, i.e. 8-bit signed<->unsigned conversion)
# between the entry buffer and the obj->12 buffer with MemCpy_SdkRuntime
# moves and entry->24 offset bookkeeping, then vcall entry->356 and
# entry->348 again. Unlocks via MutexUnlock_ReleaseMutant. 7 call sites,
# all sibling methods in the same 0x832B end-of-.text family, each gating
# the call on a different non-zero object field. The XOR-0x80 byte churn is
# the signature of 8-bit sample conversion — plausibly an audio voice/sound
# pipeline, but the vtable contents are unresolved so the name stays
# mechanism-based.
[functions."0x832B3700"]
name = "CriticalSection_ProcessEntryArray_832B3700"


# Spin-lock acquire (test-and-set with spin). Args: addr (r3) -> a u32
# flag where 0 = free / 1 = held. Behavior: read *addr; if 0, atomically
# CAS it to 1 (claim) and return; if non-zero (held), spin re-reading
# *addr until it reads 0, then claim it. Uses an lwarx/stwcx. atomic pair
# inside the recompiler's global-lock region (mfmsr/mtmsrd MSR sync), with
# an lwsync after the claim, and a db16cyc delay hint once the spin counter
# passes 40 (bus-contention back-off). Returns void. Sits in the wait/
# sync infrastructure (immediately before KeWaitForSingleObject at
# 0x822D74A0). 15 call sites, all in a data-processing subsystem: each
# loads a global object, adds an offset (a per-object lock word at +12/+32/
# +36/+40/-7828 etc.), and calls this BEFORE reading that object's fields —
# i.e. a spin-lock guard. Named SpinLock_Acquire (the matching release that
# sets the flag back to 0 is a separate function).
[functions."0x822D7408"]
