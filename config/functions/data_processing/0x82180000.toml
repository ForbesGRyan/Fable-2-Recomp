# sub_82C84920, sub_82C83900, ...). Parallel to ClampAndUpdate_822F6380 (which
# uses sub_822F6E18 for the in-place update); here the in-place helper is
# sub_822F1F60. Named for the mechanism: a clamped range update (grow if
# needed), in place or across objects.
