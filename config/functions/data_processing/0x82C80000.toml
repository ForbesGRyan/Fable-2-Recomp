# overlap): copy BACKWARDS so the source isn't clobbered -- first byte-by-byte until
# dst is 4-byte aligned (from the end: *--dst = *--src), then 4-byte word-by-word
# backwards. Returns void. 80 callers (sub_82171010, sub_8319BA60, Func_82CB4CB8,
# sub_82BAF318, Exception_82CC031C, ...). This is the classic memmove: a copy that is
# safe when src and dst overlap. Sits next to MemCpy_SdkRuntime in the memory family.
