# SDK mutex family (Xbox 360 mutexes are mutants).
#
# Lock side: 2-instruction thunk, r5 = 0 then tail-calls KeWaitForSingleObject_Guest.
# Timeout 0 -> WaitEntrySetLpWakeTime writes LpWakeTime = 0 (no timer) so the
# wait is INFINITE, not a zero-wait poll (and -1 also maps to 0, so 0 cannot
# mean "don't block" or INFINITE would be unexpressible). Blocks until the
# object is signaled; APCs are not retried (timeout==0), so STATUS_USER_APC
# (257) can be returned. r4 (wait reason) is ignored by the wrapper; callers
# still pass -1/0/flags in it. 42 call sites: audio/video/rendering worker
# threads blocking on per-object handles, SDK alert/exit loops. Paired with
# MutexUnlock_ReleaseMutant (0x83004F30) at sites such as sub_832B8DA8.
[functions."0x82196C58"]
name = "MutexLock_WaitInfinite"


# A value/state processor that returns the non-zero-ness of its value argument.
# Args: obj (r3), value (r4), flag (r5). Every exit path evaluates the idiom
# (r11 = 0 - value; r10 = -1 + carry; return r10 & 1), which is 1 iff value !=
# 0 and 0 iff value == 0 -- so the RETURN is simply (value != 0). The real work
# is value-dependent SIDE EFFECTS along the way: if value > -2 call
# sub_82CD11D0(); if obj->24 < value call sub_821A9170(obj, value, obj->20);
# else (obj->24 >= value), if flag != 0 and value < 16 and value < obj->20 call
# sub_822F1DB0(obj, 1, value), and if value == 0 and obj->20 < 16 store 0 to
# obj->20 and a byte to obj->4. 8 callers, all consuming the low byte of the
# result as a boolean gate. The object class and helper identities aren't
# resolvable, so the name states the observable contract: process a value
# (with side effects) and return whether it was non-zero.
[functions."0x821A9090"]
name = "ProcessValue_FlagNonZero_821A9090"


