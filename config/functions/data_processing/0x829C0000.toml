# addi r3,r1,N; bl sub_829CE870" — i.e. it is invoked on a stack slot (often
# twice, at two different offsets) right after constructing/using an object,
# and a second common shape is "mr r3,obj; bl sub_829CE870" (called on an
# object, then another op follows). A no-op called this uniformly on
# objects/stack slots is the signature of an EMPTY virtual method — most
# likely a no-op destructor / release / delete for an object type whose
# teardown does nothing in this build (the call is still emitted for ABI/
# dispatch correctness). The exact interface slot is not resolvable without
# the vtables, so the name states the observable fact: it is a no-op.
