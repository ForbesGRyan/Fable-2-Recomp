# setjmp/longjmp: the recompiler redirects these to native implementations.
# longjmp (0x82CA9260) restores the full guest state from the jmp_buf and
# calls RtlUnwind (thunk 0x832B25BC) on the unwind path.
# setjmp (0x83000200) stores the full guest state (f14-f31, r13-r31, VMX,
# CR, LR) to the jmp_buf, using the same layout longjmp restores.
longjmp_address = 0x82CA9260
setjmp_address = 0x83000200

# --- Recomp-level patches via mid-asm hooks --------------------------------
# The mid-asm hooks (register rewrites injected at specific guest instruction
# addresses, implemented in src/core/fable2_hooks.cpp) are defined in
# config/midasm_hooks.toml and pulled in via `includes` above. See
# docs/patches.md and that file for the full set and per-hook notes.


# Conservative settings: no register optimizations
skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = true
non_volatile_as_local = true

# Invalid instruction skips: 32-bit values (big-endian) the recompiler skips
# over during its linear .text walk instead of analyzing them as functions.
#   0x00000000      -- zero padding between functions (not a valid PPC insn)
#   0x00485645      -- end-of-.text data table at 0x832B31E0 (185 words of
#                      offset data, 0x832B31E0-0x832B34C4); skip all 740 bytes
[[entrypoint.invalid_instructions]]
data = 0x00000000
size = 4

[[entrypoint.invalid_instructions]]
data = 0x00485645
size = 740

# Manual function boundaries from the XenonRecomp config.
#
# ReXGlue rejects overlapping standalone function boundaries (XenonRecomp
# allowed them), so four entries that nested inside a larger entry were trimmed
# to end where the inner function begins. Original sizes are preserved in
# XenonRecomp/fable2.toml if these turns out to be wrong:
#   0x82BE9668: 0x08D4 -> 0x0018  (inner 0x82BE9680 starts at +0x18; both
#               originally ended at 0x82BE9F3C)
#   0x82C89840: 0x01D8 -> 0x0078  (inner 0x82C898B8 starts at +0x78)
#   0x82C898B8: 0x0154 -> 0x00A8  (inner 0x82C89960 starts at +0xA8)
#   0x82C8D3F0: 0x01E8, and the nested 0x82C8D4E8 entry was removed. With both
#               present the gap-fill extended the outer past its trimmed size and
#               codegen emitted a cross-function goto into 0x82C8D4E8 (compile
#               error). Keeping the outer at its original full size makes the
#               region one function; calls into it mid-body are handled as tail
#               calls to internal labels. Original inner entry: size 0x00F0.
