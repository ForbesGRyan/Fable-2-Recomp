# as the object) and then free the resource via Free_SizeBucketed_Thunk_8221BE68
# (the main free). Finally clear wrapper->0 and wrapper->4. A classic COM-style
# Release(): drop one reference, and if this was the last, destroy + free.
# 2794 call sites -- the dominant reference-release path.
