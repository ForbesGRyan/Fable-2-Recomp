# Spin-locked pool / free-list node acquisition. Args: obj (r3) — selected
# by the 4 callers by indexing an array (base = caller's obj->4, 4-aligned
# index) to pick a per-slot object. Layout: obj->16 = head of a node list,
# obj->4 = step/size, obj->24 = lower window bound, obj->28 = upper window
# bound, obj+36 = the spin-lock word (guarded by SpinLock_Acquire_822D7408).
# Flow: acquire the spin-lock; if the list is empty call sub_83230568(obj)
# to produce a node (if that also yields nothing, release and return 0);
# otherwise take the head node, advance its internal chain pointer
# (node->0 = *node->0), increment a counter (node->4 += 1), and if the
# chain is exhausted (*node->0 == 0) unlink the node from the list (via the
# node->8 next pointers, fixing the head if needed); then advance the
# allocation window (obj->24 += obj->4, obj->28 -= obj->4); release the
# lock; return the new chain head (node->0) or 0. A synchronized block/node
# dispense from a pool. The object identity is unresolved (it is one of the
# per-slot objects in the data-processing subsystem), so the name describes
# the mechanism and keeps the address suffix.
[functions."0x83230688"]
name = "Pool_AcquireNode_83230688"


# ---------------------------------------------------------------------------
# MAIN SIZE-BUCKETED ALLOCATOR (the game's primary "malloc", 3725 call sites)
#
# This is a SEPARATE, higher-level allocator from the low-level custom heap
# (Heap_AllocateBlock_82238828 / Heap_FreeBlock_822394F0, which carve blocks
# out of NtAllocateVirtualMemory regions). Three functions form the entry
# chain:
#
#   sub_8221F388 (3725 callers) -- the "safe" wrapper everyone calls:
#       r31 = sub_8221F3F0(size);            // allocate
#       if (r31 == 0) {                       // OOM:
#           if (*(global_fnptr @ ~0x82000B0C)) { r4 = 0; call it }  // OOM error-report callback
#           sub_82CBBB58();                   // = __imp__DbgBreakPoint (1-insn thunk)
#       }
#       return r31;
#   sub_8221F3F0 (142 callers) -- 1-insn thunk: "b 0x83231d20" -> the core.
#   sub_83231D20 (2 callers)   -- the core size-bucketed allocator.
#
# So sub_8221F388 = "allocate(size); on OOM report + debug-break". OOM is
# treated as fatal (DbgBreakPoint), which is why this is the dominant
# allocation path: game code allocates through it and never checks for NULL
# (the wrapper guarantees non-NULL or a breakpoint).
# ---------------------------------------------------------------------------

# The core size-bucketed allocator. Arg: size (r3). Returns a pointer, or 0
# if the size can't be satisfied. Flow:
#   1. Lazy init: if an init-flag byte (game data) is 0, call sub_83231B60().
#   2. FAST PATH: linear-scan a 6-entry table of cached sizes; if `size` is
#      one of them, jump to a per-size fast path.
#   3. Otherwise dispatch by size to a pool:
#        size <= 64        -> index (size+3) into a pre-built node pool and
#                            Pool_AcquireNode_83230688 the selected node
#                            (returns 0 if size > that pool's max entry).
#        64  < size <= 512 -> spin-locked pool: SpinLock_Acquire(pool+40),
#                            sub_83231590(pool, size), release (->40 = 0).
#        512 < size <= 10240 -> a second spin-locked pool (same shape).
#        10240 < size <= 10485760 (10 MB) -> a third spin-locked pool.
#        size > 10 MB        -> sub_83230900(size) (large-allocation path).
#   Each pool has a max-size cap (checked via a global); exceeding it returns 0.
# A size-bucketed allocator: small sizes use a fixed-node pool, mid/large sizes
# use dedicated spin-locked pools, and huge sizes fall through to a large path.
[functions."0x83231D20"]
name = "Allocate_SizeBucketed_83231D20"


# 1-insn thunk: "b 0x83231d20" -- forwards (size) to the core allocator
# Allocate_SizeBucketed_83231D20 unchanged and returns its pointer. 142
# callers use this entry directly (they handle the 0/NULL result themselves
# rather than going through the OOM-crashing wrapper sub_8221F388).
[functions."0x8221F3F0"]
name = "Allocate_SizeBucketed_Thunk_8221F3F0"


# The game's PRIMARY allocation entry point (3725 call sites -- the dominant
# "malloc"). Arg: size (r3). Calls Allocate_SizeBucketed_Thunk_8221F3F0(size)
# (-> Allocate_SizeBucketed_83231D20) to get a pointer. If the result is 0
# (OOM): read a global function pointer (~0x82000B0C), and if non-zero call it
# with (r4 = 0) as an OOM error-report callback, then call sub_82CBBB58 which
# is a 1-insn thunk to __imp__DbgBreakPoint (debug breakpoint). Returns the
# pointer. Net effect: "allocate(size); on failure report + debug-break", i.e.
# OOM is fatal and callers never need to NULL-check. Sits one layer above the
# low-level custom heap (Heap_AllocateBlock_82238828).
[functions."0x8221F388"]
name = "Allocate_OrDbgBreak_8221F388"


# ---------------------------------------------------------------------------
# FREE SIDE of the size-bucketed allocator (the game's primary "free",
# 4498 call sites -- even hotter than the allocate entry at 3725).
#
#   sub_8221BE68 (4498 callers) -- the main free() entry: 1-insn thunk
#       "b 0x83231be8" -> Free_SizeBucketed_83231BE8.
#   sub_83231BE8 (2 callers)    -- the core free(): given a pointer, try to
#       release it from each size pool in turn; return 1 if freed, 0 if not.
#       - not initialized (same init byte as the allocator) -> return 0
#       - ptr == NULL                                        -> return 1 (no-op ok)
#       - pool <=64   : Pool_FreeByAddress_832304E8(ptr, pool)  -> freed?
#       - pool 64-512 : Pool_FreeByAddress_832304E8(ptr, pool)  -> freed?
#       - pool 512-10240 / 10240-10MB / one more : SpinLock +
#         sub_83231518(pool, ptr) (spin-locked pool free)        -> freed?
#       - else (large): sub_83230848(ptr) (large-path free)     -> freed?
#   sub_832304E8 (4 callers)    -- find the block containing `ptr` in a pool
#       (walk the pool's block list r4->28; base r4->20) and free it; return
#       1 if the pointer was in this pool, 0 otherwise. Used by the two small
#       pools of Free_SizeBucketed.
#   sub_83230320 (1 caller)     -- the spin-locked single-block free: push the
#       address back onto its block's free list, decrement the block's in-use
#       count, advance the pool window; if the block empties, unlink the whole
#       block from the pool's free-block list. Called only by sub_832304E8.
#
# This is the exact counterpart of the allocate side (Allocate_OrDbgBreak / 
# Allocate_SizeBucketed): free walks the same size buckets the allocator used.
# ---------------------------------------------------------------------------

# 1-insn thunk: "b 0x83231be8" -- forwards the pointer to Free_SizeBucketed_
# 83231BE8. The game's PRIMARY free() entry point (4498 call sites -- the
# dominant free, called more often than the allocate entry). Plain free(ptr):
# returns 1 if the pointer was released (or was NULL), 0 if it was not owned
# by this allocator. Sits one layer above the low-level custom heap
# (Heap_FreeBlock_822394F0).
[functions."0x8221BE68"]
name = "Free_SizeBucketed_Thunk_8221BE68"


# The core size-bucketed free(). Arg: pointer (r3). Returns 1 if freed, 0 if
# not owned. Flow: (1) if the allocator's init byte is 0, return 0. (2) NULL
# -> return 1 (freeing NULL is a valid no-op). (3) Try the small pools first
# via Pool_FreeByAddress_832304E8(ptr, pool) for the <=64 and 64-512 pools;
# if either reports the pointer was freed, return 1. (4) Then the spin-locked
# pools (512-10240, 10240-10MB, and one more) via SpinLock_Acquire(pool+40) +
# sub_83231518(pool, ptr) + release; return 1 if one frees it. (5) Otherwise
# the large path: sub_83230848(ptr); return the freed bit. The exact mirror of
# Allocate_SizeBucketed_83231D20's size buckets. 2 callers (the thunk and
# sub_82BEAB88).
[functions."0x83231BE8"]
name = "Free_SizeBucketed_83231BE8"


# Find-and-free by address for a pool's small blocks. Args: ptr (r3), pool
# (r4). Walks the pool's block list (head at r4->28; each node ->0 = start
# offset, ->12 = next; base at r4->20) looking for the block whose range
# [node_start, base + node_start) contains ptr. If found: align ptr down to
# the pool's granularity (r4->0), load the block descriptor at the aligned
# address + 12, call Pool_FreeNode_83230320(desc, ptr) to release it, and
# return 1. If no block contains ptr, return 0. 4 callers: the two small pools
# of Free_SizeBucketed_83231BE8, plus sub_828456C8 and sub_8240DAA8.
[functions."0x832304E8"]
name = "Pool_FreeByAddress_832304E8"


# The spin-locked single-block free for a pool. Args: pool (r31), ptr (r4).
# SpinLock_Acquire(pool+36). Aligns ptr to the block granularity, pushes the
# address onto its block's free list (head at block->0, in-use count at
# block->4, decrementing it), and advances the pool's window (pool->24 /
# pool->28, step pool->4). If the block's in-use count reaches 0, unlinks the
# whole block from the pool's free-block list (head pool->16, via block->8
# next). Calls sub_83235FC0(pool->20) as a helper, recomputes the window, then
# releases the lock (pool+36 = 0). The release counterpart of
# Pool_AcquireNode_83230688. Single caller: Pool_FreeByAddress_832304E8.
[functions."0x83230320"]
name = "Pool_FreeNode_83230320"


