# Args: obj (r3, the container), node (r4, ->4 = data, ->8 = a "filled" field), (r5, r6 = args). If node->8
# is 0 (the node is empty / not yet filled), it inserts the node (sub_82551330, an insert, passing obj,
# node->4, 1, and the args) and returns obj. Otherwise it processes the node: it looks up the chain root
# (FindChainRoot2_823D4F20, sub_823D4F20) and calls sub_82498700 and sub_825511F0 (siblings in the 0x8249/0x8255
# cluster). So it's a "insert the node if empty, otherwise find the chain root and process" routine (a
# node insertion with a chain lookup, part of the 0x8255 chain/lookup cluster). 306 lines, 4 callees (sub
# _82551330, FindChainRoot2_823D4F20, sub_82498700, sub_825511F0). 1 caller: ChainLookup_82550638 (sub_82550638).
# The node's class (->4 = data, ->8 = a filled flag) and the container's meaning aren't resolvable, so the
# name states the mechanism: insert the node (with a chain lookup).
[functions."0x82550F90"]
name = "InsertNodeChain_82550F90"


