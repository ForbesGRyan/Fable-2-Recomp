# CS-guarded virtual-call wrapper, one of ~11 uniform siblings in the
# 0x82CD2Cxx-0x82CD2Fxx block. Pattern (verified across the cluster):
# RtlEnterCriticalSection(global CS at 0x82CD0324); target = arg1->76
# (a C++ object, vptr at +0); call vtable[+60/4 = slot 15] with
# (this=target, out=arg2); RtlLeaveCriticalSection; return the result.
# The sibling slots are 28/56/60/64/72/80/92/96 (plus two that forward to
# helpers sub_82CDC180/sub_82CDCFE8) — i.e. a synchronized proxy class in
# the SDK runtime around one core object, all methods sharing the single
# global CS. 2 call sites: RingBuffer_TickPadWithFillByte_832B68A0 (polled
# 3x, looping while successive out-values differ by >= 1024 — a consumer
# progress query) and sub_832B6A98 (called after sibling slots 72/64 and a
# helper, in a fetch-and-advance sequence). The vtable contents are
# unresolved, so the name stays mechanism-based (slot offset in bytes).
[functions."0x82CD2DF8"]
name = "CsGuardedVcall_Slot60_82CD2DF8"


# 5-insn leaf: *r4 = (uint16_t)obj->108 * obj->120; returns 0.
# Field roles pinned down by the inverse operation sub_82CE37C0, which
# (spin-lock protected: KeRaiseIrqlToDpcLevel + KeAcquireSpinLockAtRaisedIrql
# on global 0x82CA7060, with a twllei div-by-zero trap guard) computes
# obj->120 = (*total) / obj->108 and sets obj->272 = 1 — so obj->108 is a
# unit/divisor and obj->120 the total/unit count; this function is the
# count -> total direction (unit * count, classic frameSize*frameCount /
# sampleSize*sampleCount byte-length math). Several siblings in the 0x82CE
# region write these fields (sub_82CE3BE0/sub_82CE3400/sub_82CE24B0/
# sub_82CE0C20 store the u16; sub_82CE3CF0/sub_82CE1588 update the u32).
# ZERO static call sites — vtable method of that object family.
[functions."0x82CE32B0"]
name = "StoreUnitTimesCount_82CE32B0"


# A SIMD (vector) memcpy KERNEL -- the 128-bytes-per-iteration vectorized loop
# that a vectorized memcpy dispatches to for large blocks.

# Args: dst (r3), src (r4), length (r5). For length >= 128 the main loop loads
# 8 x 128-bit vectors from src (lvx at offsets 0/16/32/48/63/64/80/96 with vperm
# alignment), stores them to dst (stvx at the same offsets), then advances dst
# and src by 128 and length -= 128, looping while length >= 128 (with dcbt/dcbzl
# cache-block hints for the large case). A scalar path (lvsl shift + tail store)
# handles length < 128. Single caller: MemCpy_Vectorized_822085D0 (it calls this
# as its large-block kernel). So it is the raw SIMD copy kernel. Named for the
# mechanism: a SIMD (128-byte-unrolled) memcpy kernel.
[functions."0x82CC9DA0"]
name = "MemCpy_SIMDKernel_82CC9DA0"


# A delay / sleep: compute a millisecond delay as a 100ns-tick relative time and call
# __imp__KeDelayExecutionThread (a wait) in a loop.

# Args: value (r3, a duration in milliseconds), flag (r4, ->0 = a flag byte). If value is -1, it uses a
# fixed 64-bit timeout (0xFFFFFFFF_00000000). Otherwise it computes value * -10000 (a negative 100ns-
# tick relative time: 10000 ticks = 1 ms, so value ms). It then loops, calling
# __imp__KeDelayExecutionThread (a kernel delay, passing the 100ns-tick time and flag), until the flag
# byte (value & 0xFF of the flag arg) is 0. So it's a "delay for value milliseconds (polling a flag)"
# routine. 83 lines. 2 callers: ByteValueCheck_82CBC678 (sub_82CBC678) and sub_82CBC6B0. The flag's
# meaning (an "interrupted" / "abort" flag) isn't resolvable, so the name states the mechanism: delay
# for a duration in milliseconds.
[functions."0x82CC2028"]
name = "KeDelayExecutionThreadWrapper_82CC2028"


