# A clamped range update -- a SIBLING of ClampAndUpdate_822F6380 (same
# structure, different update helper), and the in-place core that
# WriteRange_AtPos_821A8F68 calls.

# Args: obj a (r3), pos/obj b (r4), length (r5), extra (r6). If (b->20 < length)
# call sub_82CD12C8 (a grow/extend); then compute a CLAMPED amount = min(extra,
