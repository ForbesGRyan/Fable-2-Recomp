# A processor that inserts (or removes) an element from a 16-byte-per-element array based on an index. It
# takes an array object (a: a start at a->4, an end at a->8), an index (b), and a value (c). It computes the
# current element count as (a->8 - a->4) / 16 (the 16-byte stride). When the index (b) is beyond the current
# count (an append) it grows / inserts the trailing element (InsertElement16_82A8BFE8). When the index (b) is
# within the array (an interior edit) it locates the element (base + (b << 4)) and updates it in place.
# This is the "insert / update this 16-byte element at index b, growing the array on append" routine for the
# 0x827C5 element-array cluster, used by 10 callers (the 0x82549/0x827C4/0x827F2/0x82884/0x82930/0x83228/
