# SDK C-runtime ctype predicate: returns bit 0 (the _UPPER flag) of the
# 256-entry u16 character-type table. Table base is runtime-loaded from
# global 0x82CCC8C4 (entry = *(base + c*2), zero-extended 16-bit). One of
# 9 uniform siblings in the 0x82CA6AB0-0x82CA6BB0 block, each extracting a
# different bit/mask of the same u16 entry: bit0 (this one, sub_82CA6AD0),
# bits 0|1|8 (sub_82CA6AB0: andi 259, sub_82CA6B90: andi 263), and single
# bits 24/26/27/28/29/30 (sub_82CA6B30/BB0/B70/B50/B10/AF0 — note: beyond
# the 16-bit load, so these read zero in the current table layout). The
# _UPPER meaning of bit 0 is pinned by its only non-cluster consumer,
# ToLower_SdkRuntime_82CA4288, which gates an A-Z -> a-z fold on it.
# 2 call sites: ToLower_SdkRuntime_82CA4288 and the dispatch table
# sub_82A25230 (which routes to the sibling predicates by index).
[functions."0x82CA6AD0"]
name = "Ctype_IsUpper_82CA6AD0"


# SDK C-runtime tolower, in classic CRT shape:
# if (0 <= c < 256 && Ctype_IsUpper(c)) return sub_821EE9E8(c); else return c
# where sub_821EE9E8 is plain ASCII fold (A-Z -> a-z, else c unchanged;
# 22 callers image-wide, so it is also the general tolower). The ctype
# guard is what makes this the locale-aware variant. 2 call sites, both
# string processing: sub_82448030 is a CASE-INSENSITIVE FNV-1 string hash
# (hash = tolower(byte) ^ (hash * 16777619), 16777619 = 0x01000193 = the
# 32-bit FNV prime) and sub_83002B80 converts a character to a 0-25 letter
# index (result - 96, 'a' = 97). Named ToLower_SdkRuntime (not bare
# "tolower") to keep the guest symbol distinct from host libc, matching the
# MemCpy_SdkRuntime convention.
[functions."0x82CA4288"]
name = "ToLower_SdkRuntime_82CA4288"


# ---------------------------------------------------------------------------
# A signed-byte strcmp (169 callers), two vtable methods (a slot-3 product
# write and a global-callback accumulator), and a value/state processor.
# ---------------------------------------------------------------------------

# A signed-byte string compare (strcmp with sign-extended bytes). Args: str1
# (r3), str2 (r4). Loop: load *str1 as a SIGNED byte (lbz then extsb) into r10;
# if *str1 != 0 go to compare; else (str1 hit its 0 terminator) load *str2 and
# if *str2 == 0 return 0 (both empty / equal), else fall through to compare
# (where 0 < *str2 so str1 is shorter). Compare: load *str2 as a signed byte
# into r11; if r10 < r11 return -1, if r10 > r11 return 1, else advance both
# and loop. Returns -1 (str1 < str2), 0 (equal), 1 (str1 > str2). The sign-
# extension (extsb) makes this a SIGNED byte compare (bytes >= 0x80 sort as
# negative), distinct from an unsigned strcmp. 169 call sites. Named
# StrCmp_Signed to convey the signed-byte ordering and to keep the guest symbol
# distinct from host libc.
[functions."0x8226D7A8"]
name = "StrCmp_Signed_8226D7A8"


# The game's PRIMARY 32-bit string hash -- FNV-1 (case-SENSITIVE). 2167 call
# sites, making it one of the hottest functions in the binary.

# Args: str (r3, a null-terminated byte string), seed (r4, the initial hash
# value). First scans str to find its length (stop at the 0 byte); if the string
# is empty, return immediately (returning the seed). Otherwise run the FNV-1
# loop over each byte: hash = (hash * 0x01000193) ^ byte, where 0x01000193
# (16777619) is the FNV-1 32-bit prime. Returns the 32-bit FNV-1 hash. The
# callers pass seed = 0x811C9DC5 (the standard FNV-1 32-bit offset basis), so
# in practice this is the canonical FNV-1 32 hash of a string. This is the
# case-SENSITIVE variant; the case-insensitive FNV-1 is sub_82448030. Named
# FNV1Hash to convey the exact algorithm.
[functions."0x821F3C28"]
name = "FNV1Hash_821F3C28"


